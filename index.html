<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walking Pi</title>
  <meta name="description" content="A walk on a grid in 2D or 3D driven by the base-2 to base-6 digits of π, other constants and large primes.">
  <link rel="stylesheet" href="style.css?v=20261004r">
</head>
<body>
  <header>
    <div class="header-row">
      <div id="modeTabs" class="tabs" role="tablist"></div>
      <h1>Walking <span class="pi">π</span> <span id="version" class="version" title="0.1.0 = first commit, +1 per commit"></span></h1>
    </div>
    <p id="description" class="subtitle"></p>
  </header>

  <main>
    <aside class="panel">
      <section>
        <h2 id="walkHeading">Walk</h2>
        <div id="modeList" class="mode-list" role="listbox"></div>
        <label hidden>Walk mode (menu kept as the source of truth for the tabs in the header)
          <select id="mode">
            <optgroup label="2D walks">
              <option value="turtle">Squares turtle — base 3 (left / forward / right)</option>
              <option value="cardinal">Squares cardinal — base 4 (N / E / S / W)</option>
              <option value="triLR">Triangles — base 2 (left / right)</option>
              <option value="triFixed">Triangles — base 3 (3 fixed edges)</option>
              <option value="hexRel">Hexagons — base 5 (5 relative turns)</option>
              <option value="hexFixed">Hexagons — base 6 (6 fixed directions)</option>
            </optgroup>
            <optgroup label="3D walks">
              <option value="cubeRel">Cubes — base 5 (5 relative turns)</option>
              <option value="cubeFixed">Cubes — base 6 (6 fixed directions)</option>
            </optgroup>
            <optgroup label="Walks on surfaces">
              <option value="torusWalk">Square torus — base 3 (left / forward / right)</option>
              <option value="hexTorusWalk">Hex torus — base 5 (5 relative turns)</option>
              <option value="cubeFlat">Cube — base 3 (left / forward / right)</option>
              <option value="tetraLR">Tetrahedron — base 2 (left / right)</option>
              <option value="octaLR">Octahedron — base 2 (left / right)</option>
              <option value="icosaLR">Icosahedron — base 2 (left / right)</option>
            </optgroup>
            <optgroup label="Automata on surfaces">
              <option value="lifeCube">Life — cube</option>
              <option value="lifeTorus">Life — torus</option>
              <option value="lifeHexTorus">Life — torus</option>
              <option value="lifeTetra">Life — tetrahedron</option>
              <option value="lifeOcta">Life — octahedron</option>
              <option value="lifeIcosa">Life — icosahedron</option>
            </optgroup>
            <optgroup label="2D spirals">
              <option value="spiral">Ulam square spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="triSpiral">Ulam triangle spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="hexSpiral">Ulam hexagon spiral — base 2 (1 = draw, 0 = skip)</option>
              <option value="jump10">Ulam spiral jumps — base 10</option>
              <option value="jump64">Ulam spiral jumps — base 64</option>
              <option value="search10">Ulam spiral search — base 10</option>
              <option value="search64">Ulam spiral search — base 64</option>
            </optgroup>
          </select>
        </label>
        <div id="sphereRow" hidden>
          <div class="stepper">
            <button id="sizeDown" title="Smaller surface">−</button>
            <span id="sizeLabel"></span>
            <button id="sizeUp" title="Bigger surface">+</button>
          </div>
          <select id="sphereF" hidden></select>
        </div>
      </section>

      <section id="automataSection" hidden>
        <h2>Automata</h2>
        <label id="lifeRuleRow">Rule
          <select id="lifePreset">
            <option value="B3/S23">■▲ B3/S23 — Life (2 states)</option>
            <option value="B3/S23/Immigration">■▲ B3/S23/Immigration — Life with two civilisations, red and blue (3 states)</option>
            <option value="B45/S345/C4">▲ B45/S345/C4 — lasting sparse activity (4 states)</option>
            <option value="B34/S2/C4">▲ B34/S2/C4 — on the edge of extinction (4 states)</option>
            <option value="B2/S/C3">■ B2/S/C3 — Brian's Brain, permanent chaos (3 states)</option>
            <option value="B2/S345/C4">■ B2/S345/C4 — Star Wars, square-grid classic (4 states)</option>
            <option value="B34/S123/C3">⬡ B34/S123/C3 — lasts longest, ends in long loops (3 states)</option>
            <option value="B24/S134/C4">⬡ B24/S134/C4 — on the edge of extinction (4 states)</option>
            <option value="B24/S35">⬡ B24/S35 — Life-like, lasting, a few survivors</option>
            <option value="B234/S234">⬡ B234/S234 — methuselahs: 3 cells can last 2,000+ generations</option>
            <option value="B234/S1234">⬡ B234/S1234 — methuselahs, and every small start settles</option>
            <option value="B2/S34">⬡ B2/S34 — hexagonal Life, with gliders</option>
            <option value="B1/S0123456">⬡ B1/S0123456 — snowflakes, grown from a few cells</option>
            <option value="B36/S23">■ B36/S23 — HighLife, with a replicator</option>
            <option value="B3/S12345">■ B3/S12345 — Maze, grows corridors</option>
            <option value="B3/S1234">■ B3/S1234 — Mazectric, longer corridors</option>
            <option value="B3678/S34678">■ B3678/S34678 — Day &amp; Night, alive and dead are symmetric</option>
            <option value="B2/S">■ B2/S — Seeds, explosive</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label id="lifeCustomRow" hidden>Custom rule (B…/S…/C… or B…/S…/Immigration)
          <input id="lifeRule" type="text" value="B3/S23" autocomplete="off">
        </label>
        <div id="huntRow">
          <div class="field-label">Methuselah hunt</div>
          <div id="huntList" class="mode-list" role="listbox" title="Where the random starts go. Radius r: the cells at most r steps from a centre cell, one step going to a neighbour (through an edge or a corner) — 3×3, 5×5 and 7×7 on squares, a small disc on triangles. The rest of the surface starts dead"></div>
          <div class="row">
            <button id="huntBtn" title="1,000 random starts, then 2,000 tweaks of the best one, then it plays. Click again to skip to the tweaks, then to play the best so far">Hunt</button>
          </div>
          <p id="huntStatus" class="muted"></p>
        </div>
      </section>

      <section>
        <h2>Digits</h2>
        <div id="numberList"></div>
        <label id="mersenneRow" hidden>Prime
          <select id="mersenneP"></select>
        </label>
        <label id="primorialRow" hidden>Prime
          <select id="primorialP"></select>
        </label>
        <label id="primeSizeRow" hidden>Size
          <select id="primeSize">
            <option value="100">100 decimal digits</option>
            <option value="300" selected>300 decimal digits</option>
            <option value="1000">1,000 decimal digits</option>
            <option value="2000">2,000 decimal digits</option>
          </select>
        </label>
        <label>Formula
          <input id="formula" type="text" value="pi" spellcheck="false" autocomplete="off"
                 title="Any number as a formula: pi, e, phi, gamma, catalan, erdos, sqrt(3), cbrt(2), root(x, k), ln(x), exp(x), log(x, b), zeta(k), 22/7, 2^pi, 8^(1/3), 2^127-1, primorial(p)+1, randprime(size, seed), and + − × ÷ ^ ( ). Digit sequences, used alone: random(seed), champernowne, primes, primegaps, dragon. Press Enter to compute">
        </label>
        <div id="digitsRow">
          <div class="stepper">
            <button id="digitsDown" title="Fewer digits">−</button>
            <span id="digitsLabel"></span>
            <button id="digitsUp" title="More digits">+</button>
          </div>
          <input id="digits" type="hidden" value="20000">
        </div>
        <button id="copyNumber" class="wide" data-icon="copy" title="The number in the walk's base, with every digit in use" hidden>Copy number to clipboard</button>
        <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
        <p id="status" class="muted">—</p>
      </section>

      <section>
        <h2>Setups</h2>
        <label>Saved setups
          <select id="setupList"></select>
        </label>
        <div class="row">
          <button id="setupSave" data-icon="star" title="Save the whole current setup in this browser">Save</button>
          <button id="setupDelete" title="Delete the selected saved setup">Delete</button>
          <button id="setupLink" data-icon="link" title="Copy a link that opens this exact setup">Link</button>
        </div>
        <div class="row">
          <button id="setupExport" title="Download all saved setups as a JSON file">Export JSON</button>
          <button id="setupImport" title="Add the setups of a JSON file">Import JSON</button>
        </div>
        <input id="setupFile" type="file" accept="application/json,.json" hidden>
        <p id="setupStatus" class="muted"></p>
      </section>
    </aside>

    <div id="stage" class="stage">
      <canvas id="gridLayer"></canvas>
      <canvas id="fillLayer"></canvas>
      <canvas id="pathLayer"></canvas>
      <canvas id="overlayLayer"></canvas>
      <div id="hint" class="hint">Wheel: zoom · Drag: pan · Double-click: auto-fit</div>
      <div id="animBar" class="stage-box stage-bar" aria-label="Animation and stats">
        <div class="stage-more">  <!-- shown on hover, above the Play row -->
          <dl class="stats">
            <dt id="lifetimeLabel" hidden>Lifetime</dt><dd id="sLifetime" hidden>—</dd>
            <dt id="lStat0">Steps</dt><dd id="sStep">0</dd>
            <dt id="lStat1">Position</dt><dd id="sPos">(0, 0)</dd>
            <dt id="lStat2">Distance</dt><dd id="sDist">0</dd>
            <dt id="lStat3">Max distance</dt><dd id="sMax">0</dd>
            <dt id="lStat4">Cells visited</dt><dd id="sCells">1</dd>
            <dt id="sCountsLabel">0 / 1 / 2</dt><dd id="sCounts">0 / 0 / 0</dd>
          </dl>
          <div id="digitStrip" class="strip" aria-label="Recent digits"></div>
          <label>Speed: <span id="speedLabel"></span>
            <input id="speed" type="range" min="0" max="100" step="any" value="18.416">
          </label>
        </div>
        <div class="row">
          <button id="restart" data-icon="start" title="Jump to start (R)" aria-label="Jump to start"></button>
          <button id="play" title="Play / pause (Space)">Play</button>
          <button id="step" title="One step (→)">Step</button>
          <button id="end" data-icon="end" title="Jump to end (E)" aria-label="Jump to end"></button>
        </div>
      </div>
      <div id="viewTools" class="stage-box display-menu">
        <label class="check stage-head" id="autoFitRow" title="Fit the view to the walk and keep it fitted (F or double-click); hover for the display settings"><input id="autoFit" type="checkbox" checked> Auto-fit</label>
        <div class="stage-more">  <!-- shown on hover, below -->
          <div id="colorsRow"><div id="colorButtons" class="choice-list"></div></div>
          <select id="colorMode" hidden>
            <option value="gradient">Rainbow along the walk</option>
            <option value="cells">Rainbow cells along the walk</option>
            <option value="visits">Rainbow by number of visits</option>
            <option value="digit">One colour per digit</option>
            <option value="mono">One colour</option>
          </select>
          <label class="check" id="fillAreasRow" hidden><input id="fillAreas" type="checkbox"> Fill areas</label>
          <label class="check" id="gridRow"><input id="showGrid" type="checkbox" checked> Grid</label>
          <div id="skyRow" hidden>
            <div class="field-label">Sky</div>
            <div id="skyButtons" class="choice-row"></div>
            <select id="sky" hidden>
              <option value="twilight">Twilight</option>
              <option value="blue">Deep blue</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <label class="check" id="autoRotateRow" hidden><input id="autoRotate" type="checkbox"> Auto-rotate</label>
          <div id="formSection" class="form-section">  <!-- the form of the view, set by each walk mode -->
            <div id="shapeRow" hidden>
              <div id="shapeButtons" class="choice-row" title="The same cells, flat or round: the walk goes on meanwhile"></div>
            </div>
            <label class="check" id="perspectiveRow" hidden><input id="perspective" type="checkbox"> Perspective</label>
          </div>
        </div>
      </div>
      <div id="numberPreview" class="number-preview" hidden></div>  <!-- over the whole view -->
    </div>
  </main>

  <script src="main.js?v=20261004r"></script>
</body>
</html>
