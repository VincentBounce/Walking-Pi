<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walking Pi</title>
  <meta name="description" content="A walk on a grid in 2D or 3D driven by the base-2 to base-6 digits of π, other constants and large primes.">
  <link rel="stylesheet" href="style.css?v=20260929f">
</head>
<body>
  <header>
    <h1>Walking <span id="titleSym" class="pi">π</span></h1>
    <p id="rule" class="subtitle"></p>
  </header>

  <main>
    <aside class="panel">
      <section>
        <h2>Digits</h2>
        <label>Number
          <select id="constant"></select>
        </label>
        <label id="fractionRow" hidden>Fraction p/q
          <input id="fraction" type="text" value="22/7" inputmode="numeric" autocomplete="off">
        </label>
        <label id="mersenneRow" hidden>Prime
          <select id="mersenneP"></select>
        </label>
        <label id="primorialRow" hidden>Prime
          <select id="primorialP"></select>
        </label>
        <label id="primeSizeRow" hidden>Size
          <select id="primeSize">
            <option value="100">100 decimal digits</option>
            <option value="300" selected>300 decimal digits</option>
            <option value="1000">1,000 decimal digits</option>
            <option value="2000">2,000 decimal digits</option>
          </select>
        </label>
        <label>Walk mode
          <select id="mode">
            <optgroup label="2D">
              <option value="turtle">Squares turtle — base₃ (left / forward / right)</option>
              <option value="cardinal">Squares cardinal — base₄ (N / E / S / W)</option>
              <option value="triLR">Triangles — base₂ (left / right)</option>
              <option value="triFixed">Triangles — base₃ (3 fixed edges)</option>
              <option value="hexRel">Hexagons — base₅ (5 relative turns)</option>
              <option value="hexFixed">Hexagons — base₆ (6 fixed directions)</option>
            </optgroup>
            <optgroup label="3D">
              <option value="cubeRel">Cubes — base₅ (5 relative turns)</option>
              <option value="cubeFixed">Cubes — base₆ (6 fixed directions)</option>
              <!-- <option value="cubeSphere">Cube sphere — base₃ (left / forward / right)</option> -->
              <option value="cubeFlat">Cube surface — base₃ (left / forward / right)</option>
              <option value="tetraLR">Tetrahedron — base₂ (left / right)</option>
              <option value="octaLR">Octahedron — base₂ (left / right)</option>
              <option value="icosaLR">Icosahedron — base₂ (left / right)</option>
              <option value="sphereLR">Geodesic sphere — base₂ (left / right)</option>
            </optgroup>
            <optgroup label="Game of Life">
              <option value="lifeCube">Life — cube surface</option>
              <option value="lifeTetra">Life — tetrahedron</option>
              <option value="lifeOcta">Life — octahedron</option>
              <option value="lifeIcosa">Life — icosahedron</option>
              <option value="lifeSphere">Life — geodesic sphere</option>
            </optgroup>
            <optgroup label="Experimental">
              <option value="spiral">Ulam square spiral — base₂ (1 = draw, 0 = skip)</option>
              <option value="triSpiral">Ulam triangle spiral — base₂ (1 = draw, 0 = skip)</option>
              <option value="hexSpiral">Ulam hexagon spiral — base₂ (1 = draw, 0 = skip)</option>
              <option value="jump10">Ulam spiral jumps — base₁₀</option>
              <option value="jump64">Ulam spiral jumps — base₆₄</option>
              <option value="search10">Ulam spiral search — base₁₀</option>
              <option value="search64">Ulam spiral search — base₆₄</option>
            </optgroup>
          </select>
        </label>
        <label id="sphereRow" hidden>Surface
          <select id="sphereF"></select>
        </label>
        <label id="lifeRuleRow" hidden>Rule (births / survivals / states)
          <input id="lifeRule" type="text" value="B3/S23" autocomplete="off" list="lifeRules">
          <datalist id="lifeRules">
            <option value="B3/S23">Life (2 states)</option>
            <option value="B45/S345/C4">4 states: lasting sparse activity on triangles</option>
            <option value="B34/S2/C4">4 states: on the edge of extinction on triangles</option>
            <option value="B2/S/C3">Brian's Brain (3 states): permanent chaos</option>
            <option value="B2/S345/C4">Star Wars (4 states, square-grid classic)</option>
          </datalist>
        </label>
        <label>Number of digits
          <input id="digits" type="number" min="10" max="1000000" step="1000" value="20000">
        </label>
        <button id="compute" class="primary">Compute</button>
        <div class="progress"><div id="progressBar"></div></div>
        <p id="status" class="muted">—</p>
      </section>

      <section>
        <h2>Animation</h2>
        <div class="row">
          <button id="play" title="Play / pause (Space)">▶︎ Play</button>
          <button id="step" title="One step (→)">Step</button>
          <button id="restart" title="Jump to start (R)">⏮</button>
          <button id="end" title="Jump to end (E)">⏭</button>
        </div>
        <label>Speed: <span id="speedLabel"></span>
          <input id="speed" type="range" min="0" max="100" step="any" value="27.96">
        </label>
      </section>

      <section>
        <h2>Display</h2>
        <label>Colors
          <select id="colorMode">
            <option value="gradient">Gradient (order)</option>
            <option value="digit">By digit</option>
            <option value="mono">Monochrome</option>
          </select>
        </label>
        <label class="check"><input id="showGrid" type="checkbox" checked> Grid</label>
        <label class="check"><input id="autoFit" type="checkbox" checked> Auto-fit</label>
        <label class="check" id="autoRotateRow" hidden><input id="autoRotate" type="checkbox"> Auto-rotate (3D)</label>
        <label class="check" id="perspectiveRow" hidden><input id="perspective" type="checkbox"> Perspective (3D)</label>
        <button id="fit">Fit view (F)</button>
      </section>

      <section>
        <h2>Stats</h2>
        <dl class="stats">
          <dt id="lStat0">Steps</dt><dd id="sStep">0</dd>
          <dt id="lStat1">Position</dt><dd id="sPos">(0, 0)</dd>
          <dt id="lStat2">Distance</dt><dd id="sDist">0</dd>
          <dt id="lStat3">Max distance</dt><dd id="sMax">0</dd>
          <dt id="lStat4">Cells visited</dt><dd id="sCells">1</dd>
          <dt id="sCountsLabel">0 / 1 / 2</dt><dd id="sCounts">0 / 0 / 0</dd>
        </dl>
        <div id="digitStrip" class="strip" aria-label="Recent digits"></div>
      </section>
    </aside>

    <div id="stage" class="stage">
      <canvas id="gridLayer"></canvas>
      <canvas id="pathLayer"></canvas>
      <canvas id="overlayLayer"></canvas>
      <div id="hint" class="hint">Wheel: zoom · Drag: pan · Double-click: fit</div>
    </div>
  </main>

  <script src="main.js?v=20260929f"></script>
</body>
</html>
